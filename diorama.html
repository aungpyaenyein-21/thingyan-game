<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">

const skyC = document.createElement('canvas'), skyT = new THREE.CanvasTexture(skyC); skyT.colorSpace = THREE.SRGBColorSpace; scene.background = skyT;
function drawSky() { // gradient + soft sun, redrawn per aspect so the sun stays round
  const H = 512, W = Math.round(H * innerWidth / innerHeight); skyC.width = W; skyC.height = H; const g = skyC.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H); [[0, '#ffd9a8'], [.45, '#f9b8a0'], [.8, '#d9a3c0'], [1, '#b39bd1']].forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  g.fillStyle = rg; g.fillRect(0, 0, W, H); skyT.needsUpdate = true;
}

const matCache = {};
const M = (c, o = {}) => matCache[c + JSON.stringify(o)] ??= new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
function mesh(geo, color, x = 0, y = 0, z = 0, opt = {}) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? M(color) : color);
  m.position.set(x, y, z); m.castShadow = opt.cast ?? true; m.receiveShadow = true;
  (opt.parent || scene).add(m); return m;
}
const box = (w, h, d, c, x, y, z, o) => mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(.07, Math.min(w, h, d) * .3)), c, x, y + h / 2, z, o);

function textTex(text, bg, fg, w = 512, h = 128, size = 64) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg;

  g.fillText(text, w / 2, h / 2 + 4);

}
function stripeTex(a, b, n = 8, plaid = false) {

  g.fillStyle = a; g.fillRect(0, 0, 32, 32); g.fillStyle = b;
  for (let i = 0; i < n; i += 2) g.fillRect(i * 32 / n, 0, 32 / n, 32);
  if (plaid) { g.globalAlpha = .45; for (let i = 0; i < n; i += 2) g.fillRect(0, i * 32 / n, 32, 32 / n); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter; return t;
}

// ---------- island (diorama base) ----------

}
for (const sx of [-1, 1]) for (const sz of [-1, 1]) { // raised sidewalks per quadrant
  const cx = sx * (HALF + R) / 2, cz = sz * (HALF + R) / 2, w = HALF - R;

  const p = mesh(new THREE.CircleGeometry(r, 14), new THREE.MeshLambertMaterial({ color: PAL.puddle, transparent: true, opacity: .8 }), x, .06, z, { cast: false });
  p.rotation.x = -Math.PI / 2;
}

const solids = []; // AABBs the player can't walk into
const solid = (x, z, w, d) => solids.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });

// ---------- shophouses ----------
function shophouse(x, z, wall, floors, sign, rotY) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  const W = 2.6, D = 2.4, FH = 1.25, H = floors * FH;
  box(W, H, D, wall, 0, .14, 0, { parent: g });
  box(W + .2, .18, D + .2, PAL.frame, 0, H + .14, 0, { parent: g });             // parapet cap
  box(.5, .4, .5, PAL.white, .7, H + .32, -.5, { parent: g });                    // water tank
  box(W - .3, .85, .06, PAL.shutter, 0, .14, D / 2, { parent: g });               // open shop front
  const st = mesh(new THREE.PlaneGeometry(W - .2, .42), new THREE.MeshLambertMaterial({ map: textTex(sign, PAL.red, PAL.frame) }), 0, 1.22, D / 2 + .04, { parent: g, cast: false });
  for (let f = 1; f < floors; f++) {
    const y = .14 + f * FH;
    for (const wx of [-.7, .7]) {
      box(.62, .74, .06, PAL.frame, wx, y + .2, D / 2, { parent: g });
      box(.46, .6, .08, PAL.window, wx, y + .27, D / 2, { parent: g });
    }
    box(W - .2, .08, .45, PAL.frame, 0, y, D / 2 + .22, { parent: g });            // balcony
    for (let r = -1.1; r <= 1.11; r += .275) box(.04, .34, .04, PAL.frame, r, y + .08, D / 2 + .42, { parent: g });
    box(W - .2, .05, .05, PAL.frame, 0, y + .42, D / 2 + .42, { parent: g });
    for (const px of [-1.0, .95]) { cyl(.09, .07, .14, '#c0683f', px, y + .04, D / 2 + .25, 8, { parent: g }); mesh(new THREE.IcosahedronGeometry(.15, 0), PAL.leafLight, px, y + .3, D / 2 + .25, { parent: g }); }
  }
  const awn = mesh(new THREE.BoxGeometry(W - .1, .05, .7), new THREE.MeshLambertMaterial({ map: stripeTex('#fff1e0', wall === PAL.pink ? '#e07a7a' : '#6fa98a') }), 0, 1.02, D / 2 + .35, { parent: g });
  awn.rotation.x = .25;
  g.updateMatrixWorld();
  const c = Math.abs(Math.cos(rotY)) > .5; solid(x, z, c ? W + .3 : D + .9, c ? D + .9 : W + .3);
}
shophouse(-6.9, -4.3, PAL.pink, 3, 'လက်ဖက်ရည်ဆိုင်', 0);
shophouse(-3.9, -4.3, PAL.butter, 2, 'ကုန်စုံဆိုင်', 0);

const MX = 5.2, MZ = -5.0;
{
  const g = new THREE.Group(); g.position.set(MX, 0, MZ); scene.add(g);

  for (const [px, pz] of [[-2.45, -1.15], [2.45, -1.15], [-2.45, 1.15], [2.45, 1.15]]) cyl(.09, .09, 2.6, PAL.bamboo, px, .9, pz, 6, { parent: g });
  const roof = mesh(new THREE.CylinderGeometry(0, 2.1, 1.1, 4, 1), PAL.red, 0, 4.05, 0, { parent: g }); roof.rotation.y = Math.PI / 4; roof.scale.set(1.75, 1, 1);
  box(5.4, .12, 3, PAL.gold, 0, 3.4, 0, { parent: g });

  const banner = mesh(new THREE.PlaneGeometry(4.2, .9), new THREE.MeshLambertMaterial({ map: textTex('သင်္ကြန်မဏ္ဍပ်', PAL.red, '#ffe7a3', 512, 110, 66) }), 0, 2.95, 1.32, { parent: g, cast: false });

// hoses → water emitters (world space)
const emitters = [];
for (const hx of [-1.6, 0, 1.6]) {

  emitters.push({ p: new THREE.Vector3(MX + hx, 1.45, MZ + 1.7), d: new THREE.Vector3(hx * .08, .75, 1).normalize(), t: rnd() });
}

// ---------- zedi (small stupa) ----------
{
  const X = 5.6, Z = 5.4;
  cyl(1.35, 1.45, .3, PAL.white, X, .14, Z, 8); cyl(1.05, 1.15, .3, PAL.white, X, .44, Z, 8); cyl(.8, .9, .3, PAL.white, X, .74, Z, 8);
  const zgold = new THREE.MeshStandardMaterial({ color: '#e0a83f', metalness: 1, roughness: .42 });

}

// ---------- padauk trees ----------
const flowerSpots = [];
function padauk(x, z, s = 1) {
  cyl(.12 * s, .18 * s, 1.4 * s, PAL.trunk, x, 0, z, 6);
  for (const [ox, oy, oz, r, c] of [[0, 1.9, 0, .95, PAL.leaf], [.55, 1.6, .3, .6, PAL.leafLight], [-.5, 1.65, -.25, .65, PAL.leafLight], [.1, 2.5, -.1, .6, PAL.leaf]]) {
    mesh(new THREE.IcosahedronGeometry(r * s, 0), c, x + ox * s, oy * s, z + oz * s);
    for (let k = 0; k < 7; k++) {
      const v = new THREE.Vector3(rnd() - .5, rnd() * .9 - .1, rnd() - .5).normalize().multiplyScalar(r * s * .95);
      flowerSpots.push(new THREE.Vector3(x + ox * s + v.x, oy * s + v.y, z + oz * s + v.z));
    }
  }
  solid(x, z, .6, .6);
}
padauk(-7.6, -2.3, 1); padauk(-3.0, 7.7, .85); padauk(7.9, 2.9, .95); padauk(2.9, -7.7, .85); padauk(3.1, 7.8, .8);

{

  const aw = mesh(new THREE.BoxGeometry(2.1, .06, 1.2), new THREE.MeshLambertMaterial({ map: stripeTex('#fff1e0', PAL.red) }), X, 1.62, Z + .1); aw.rotation.x = .18;
  const leaf = mesh(new THREE.CylinderGeometry(.32, .32, .03, 12), PAL.leaf, X - .3, .77, Z + .05); // the plate from the Piskel drawing
  for (const [ox, oy, oz] of [[-.1, .05, 0], [.1, .05, 0], [0, .05, .12], [0, .19, .04]]) mesh(new THREE.SphereGeometry(.1, 8, 6), '#fbf3df', X - .3 + ox, .79 + oy, Z + .05 + oz);

// Yangon details: poles + sagging cables
const cableM = M('#3b3040');
function sag(a, b, drop = .45) {
  const mid = a.clone().lerp(b, .5); mid.y -= drop;
  mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, mid, b), 16, .014, 4), cableM, 0, 0, 0, { cast: false });

const poles = [[-2.6, -2.4], [2.6, 2.4], [-2.6, 2.5], [7.4, -2.4]].map(([x, z]) => {

});
const P = poles;
sag(P[0].clone().add(new THREE.Vector3(-.3, 0, 0)), P[2].clone().add(new THREE.Vector3(-.3, 0, 0)), .6);
sag(P[0].clone().add(new THREE.Vector3(.3, 0, 0)), P[2].clone().add(new THREE.Vector3(.3, 0, 0)), .5);
sag(P[0], P[1], .8); sag(P[0].clone().add(new THREE.Vector3(0, -.1, 0)), P[1].clone().add(new THREE.Vector3(0, -.1, 0)), 1.0);
sag(P[1], P[3], .7); sag(P[0], new THREE.Vector3(-3.9, 2.6, -3.1), .3); sag(P[0], new THREE.Vector3(-6.9, 3.2, -3.1), .5);
sag(P[2], new THREE.Vector3(-4.8, 3.2, 6.3), .35);
// trishaw (ဆိုက်ကား)
{
  const g = new THREE.Group(); g.position.set(3.0, .14, 4.9); g.rotation.y = Math.PI / 4; scene.add(g);
  const tm = M('#2f6f8f'), wm = M('#2b2730');
  const wheel = (x, z, r) => { const w = mesh(new THREE.TorusGeometry(r, .03, 6, 16), wm, x, r, z, { parent: g }); return w; };
  wheel(-.5, 0, .32); wheel(.45, 0, .32); wheel(-.05, .75, .26).rotation.y = 0;
  const frame = (a, b) => { const c = new THREE.LineCurve3(new THREE.Vector3(...a), new THREE.Vector3(...b)); mesh(new THREE.TubeGeometry(c, 1, .035, 5), tm, 0, 0, 0, { parent: g }); };
  frame([-.5, .32, 0], [0, .62, 0]); frame([0, .62, 0], [.45, .32, 0]); frame([0, .62, 0], [-.05, .85, 0]); frame([.45, .32, 0], [.42, .95, 0]);
  box(.24, .05, .1, '#2b2730', -.05, .85, 0, { parent: g }); frame([.42, .95, -.2], [.42, .95, .2]);
  box(.7, .08, .5, tm, -.05, .45, .72, { parent: g }); box(.62, .32, .08, tm, -.05, .52, .95, { parent: g }); box(.08, .3, .45, tm, .26, .52, .72, { parent: g });
  box(.5, .06, .36, '#c8553d', -.05, .55, .72, { parent: g });
  solid(3.0, 5.1, 1.4, 1.4);
}
// charity water-pot stand (ရေအိုးစင်)
{

  for (const px of [-.55, .55]) for (const pz of [-.25, .25]) cyl(.04, .04, 1.25, '#8a5a3a', px, 0, pz, 5, { parent: g });
  box(1.25, .07, .62, '#8a5a3a', 0, .5, 0, { parent: g });

  let iy = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let farDrag = false;
  if (touch) { const dx = touch.x - touch.x0, dy = touch.y0 - touch.y, l = Math.hypot(dx, dy); if (l > 12) { ix = dx / l; iy = dy / l; farDrag = l > 90; } }
  const mv = v3.set(0, 0, 0).addScaledVector(RIGHT, ix).addScaledVector(UP, iy);
  const moving = mv.lengthSq() > .01, pa = player.anim;
  if (pa.loop !== 'dance' || moving) pa.setLoop(moving ? (keys.ShiftLeft || keys.ShiftRight || farDrag ? 'run' : 'walk') : 'idle');
  if (moving && pa.speed > 0) {
    mv.normalize();
    player.g.position.addScaledVector(mv, pa.speed * dt); collide(player.g.position);
    const want = Math.atan2(mv.x, mv.z); let d = want - player.g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.g.rotation.y += d * Math.min(1, dt * 12);
  }
  // float drives along the main road and loops through the island edges
  flt.position.x += FL.speed * dt;
  if (flt.position.x - FL.back > HALF) flt.position.x = -HALF - FL.front;
  flt.position.y = .14 + Math.sin(T * 6) * .01;
  wheels.forEach(w => w.rotation.y -= FL.speed * dt / .3);
  flt.traverse(o => { if (o.name === 'wing') o.rotation.x = Math.sin(T * 1.4) * .08 * o.userData.s; });
  { const p = player.g.position, fx = flt.position.x;
    if (p.x > fx - FL.back - .3 && p.x < fx + FL.front + .3 && Math.abs(p.z - FL.lane) < 1.25) p.z = FL.lane + Math.sign(p.z - FL.lane || 1) * 1.25; }
  player.g.position.y = groundY(player.g.position.x, player.g.position.z);

  // npcs: idle, now and then a little action; everyone animates through the same rig
  for (const c of [...crowd, vendor]) { c.idleT -= dt; if (c.idleT < 0 && !c.anim.one) { c.anim.play(pick(['wave', 'jump', 'wave'])); c.idleT = 5 + rnd() * 8; } }
  for (const c of chars) { c.cool -= dt; c.anim.update(dt); }

  // emitters
  for (const e of emitters) {
    e.t += dt;
    const on = Math.sin(T * .9 + e.p.x) > -.3;
    if (on) for (let k = 0; k < 3; k++) {
      const v = e.d.clone().multiplyScalar(5.6 + rnd() * 1.2); v.x += (rnd() - .5) * .9; v.y += Math.sin(T * 2 + e.p.x) * .6; spawn(e.p, v);
    }
  }

  // drops
  const hitList = [...crowd, ...riders, player]; for (const c of hitList) c.wp = c.g.getWorldPosition(c.wp || new THREE.Vector3());
  for (let i = 0; i < NW; i++) {
    const d = drops[i];
    if (d.life > 0) {
      d.life -= dt; d.v.y += GRAV * dt; d.p.addScaledVector(d.v, dt);
      if (d.p.y < .1) {
        if (rnd() < .18) { const r = ringD[ri = (ri + 1) % NR]; r.x = d.p.x; r.z = d.p.z; r.t = 0; }
        d.life = 0;
      }
      for (const c of hitList) {
        if (c.cool <= 0 && Math.abs(d.p.x - c.wp.x) < .38 && Math.abs(d.p.z - c.wp.z) < .38 && d.p.y < c.wp.y + 1.4 && d.p.y > c.wp.y) {
          c.cool = 2.5; // splashed! cheer, jump or shake it off
          if (!c.anim.one) c.anim.play(c === player ? 'shake' : pick(['jump', 'shake', 'wave']));
        }
      }
    }
    sc.setScalar(d.life > 0 ? 1 : 0);
    water.setMatrixAt(i, tmp.compose(d.p, q, sc));
  }
  water.instanceMatrix.needsUpdate = true;
  const flat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
  for (let i = 0; i < NR; i++) {
    const r = ringD[i]; r.t += dt; const s = r.t < .5 ? 1 + r.t * 5 : 0;
    rings.setMatrixAt(i, tmp.compose(v3.set(r.x, .09, r.z), flat, sc.setScalar(s)));
  }
  rings.instanceMatrix.needsUpdate = true;

  // petals
  for (let i = 0; i < NP; i++) {
    const p = pet[i]; p.s += dt;
    p.p.y -= dt * .45; p.p.x += Math.sin(p.s * 1.7) * dt * .35; p.p.z += Math.cos(p.s * 1.3) * dt * .25;
    if (p.p.y < .08) { p.p.y = .08; if (p.s > 30) { p.p.copy(flowerSpots[(rnd() * flowerSpots.length) | 0]); p.s = 0; } }
    q.setFromEuler(new THREE.Euler(p.p.y > .1 ? p.s * 2 : -Math.PI / 2, p.s, 0));
    petals.setMatrixAt(i, tmp.compose(p.p, q, sc.setScalar(1)));
  }
  petals.instanceMatrix.needsUpdate = true;
  bulbs.forEach((b, i) => b.scale.setScalar(1 + Math.sin(T * 3 + i) * .15));

  // camera follow (soft, clamped so the island edge stays in view)
  v3.copy(player.g.position); v3.x = THREE.MathUtils.clamp(v3.x * .6, -4, 4); v3.z = THREE.MathUtils.clamp(v3.z * .6, -4, 4); v3.y = 0;
  camTarget.lerp(v3, Math.min(1, dt * 3));
  cam.position.copy(camTarget).add(ISO); cam.lookAt(camTarget);
  look.uniforms.time.value = T % 100;
  composer.render();
});
</script>
</body>
</html>
