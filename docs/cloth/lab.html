<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cloth lab</title>
<style>html,body{margin:0;height:100%;background:#e8d6c0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// T18 check bench: ?who=bwabwa|<bottom>&build=&age=&top=&topStyle=&loop=&one=&cam=front|side|q|back&t=<seconds to run>
import * as THREE from 'three';
const qs = new URLSearchParams(location.search), g = (k, d) => qs.get(k) ?? d;
const { makeChibi, ChibiAnimator, SKINS, HAIRS, TOPS } = await import(g('src') === 'before' ? './before-chibi.js' : '../../chibi.js?v=36'); /* ?src=before: chibi.js as of main (untracked copy), for the before shots */
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e8d6c0');
scene.add(new THREE.HemisphereLight('#ffe2c4', '#9a7fb8', 1.8)); const sun = new THREE.DirectionalLight('#ffd6a0', 2.2); sun.position.set(-3, 5, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 32), new THREE.MeshLambertMaterial({ color: '#d9b894' })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const COL = { longyi: ['#3f7a5a', '#72b08b'], htamein: ['#a8434a', '#e08a8f'], pants: ['#3f5a8a', '#3f5a8a'], shorts: ['#5b7fa8', '#f6ead2'], skirt: ['#e9a0b4', '#e9a0b4'], overalls: ['#4a6a9a', '#4a6a9a'] };
const bottom = g('bottom', 'longyi'), kid = g('age', 'adult') === 'kid';
const o = g('who') === 'bwabwa'
  ? { age: 'elder', hunch: .35, build: 'round', hair: 'bun', hairColor: '#d9d3c7', top: '#f4f1e8', topStyle: 'yinphone', print: '', bottom: 'htamein', bottomColor: ['#6a4a2a', '#b08a5a'], thanaka: 'round', shoes: 'slipper', shoeColor: '#3a2a1a', accent: '#f4f1e8' }
  : { skin: SKINS[0], hair: 'short', hairColor: HAIRS[0], top: g('top', TOPS[3]), topStyle: g('topStyle', 'tee'), print: g('print', 'သင်္ကြန်'), bottom, bottomColor: COL[bottom], ...(qs.has('tuck') ? { tuck: g('tuck') === '1' } : {}), build: g('build', 'round'), age: kid ? 'kid' : 'adult', size: kid ? .72 : 1, thanaka: 'round', shoes: 'slipper', shoeColor: '#5a3a2a', accent: '#e0574f' };
if (qs.get('ol')) o.outline = true;
const ch = makeChibi(o), anim = new ChibiAnimator(ch, () => {}); scene.add(ch.root);
/* sitters in the game stand at y = .05 + lift (life.js seat(), rooms.js chairs: lift .12 to .22; Bwa Bwa's home chair .2); the seat top is where the hip ball ends */
const SEATED = ['sit', 'eat', 'vend', 'squat'].includes(g('loop')) || ['sitdown'].includes(g('one'));
if (SEATED && g('stool', '1') === '1') {
  const lift = +g('lift', .2), top = .05 + lift + (ch.hipH - .2 * ch.legK - .08) * ch.scale; ch.root.position.y = .05 + lift;
  const stool = new THREE.Mesh(new THREE.BoxGeometry(.4, top, .26), new THREE.MeshLambertMaterial({ color: '#8a5a3a' })); stool.position.set(0, top / 2, -.08); scene.add(stool);
}
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, .1, 50), c = g('cam', 'q');
const P = { front: [0, 1.0, 4.2], side: [4.2, 1.0, 0], q: [2.6, 1.3, 3.4], back: [0, 1.0, -4.2], close: [1.2, 1.1, 1.7] }[c]; cam.position.set(...P); cam.lookAt(0, c === 'close' ? .72 : .5, 0);
if (g('loop')) anim.setLoop(g('loop')); if (g('one')) anim.play(g('one'));
window.lab = { THREE, ch, anim, scene, o, step(n, dt = .05) { for (let i = 0; i < n; i++) anim.update(dt); renderer.render(scene, cam); } };
window.lab.step(+g('t', 40)); window.ready = true;
</script></body></html>
