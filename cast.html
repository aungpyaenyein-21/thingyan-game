<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ဇာတ်ကောင် စာရင်း</title>
<style>
  :root{--ink:#5a3550;--card:rgba(255,246,232,.9);--on:#f2a65a;--line:#e9c9a8}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;color:var(--ink);
    background:linear-gradient(#ffd9a8 0%,#f9b8a0 50%,#d9a3c0 85%,#b39bd1 100%);font-family:"Myanmar Sangam MN","Noto Sans Myanmar",Padauk,sans-serif}
  canvas{position:fixed;inset:0;display:block}
  #cast{position:fixed;left:12px;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
  #ui{position:fixed;right:12px;bottom:12px;width:300px;background:var(--card);border-radius:16px;padding:10px 14px;box-sizing:border-box;z-index:2;font-size:14px}
  h2{font-size:12px;font-weight:500;margin:8px 0 5px;opacity:.7}
  #note{font-size:12px;opacity:.8;margin:0 0 4px}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer}
  button.on{background:var(--on);border-color:var(--on);color:#fff}
  button.s1{border-color:#2f8fd6} button.s4{border-color:#e0574f} button.s0{border-color:#8a7a6a}
  .tag{position:fixed;transform:translate(-50%,-100%);background:var(--card);border-radius:8px;padding:2px 8px;font-size:12px;pointer-events:none;white-space:nowrap}
  @media (max-width:700px){#ui{left:8px;right:8px;width:auto;max-height:40vh;overflow:auto} .tag{font-size:10px;padding:1px 5px}}
</style>
</head>
<body>
<div id="cast"></div>
<div id="ui">
  <p id="note">အားလုံး — ① အပြာ · ④ အနီ · လူကြီး မီးခိုး။ နာမည် နှိပ်ရင် အနီးကပ်</p>
  <h2>လှုပ်ရှားမှု (အကုန်)</h2><div class="row" id="loops"></div>
  <h2>တစ်ခါလုပ်</h2><div class="row" id="ones"></div>
  <h2>ဒီဇာတ်ကောင်ရဲ့ အကျင့်</h2><div class="row" id="acts"></div>
  <h2>ကြည့်ပုံ</h2><div class="row" id="view"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CAST, makeCast } from './cast.js?v=10';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(28, 1, .1, 100);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.enableDamping = true; ctl.maxPolarAngle = 1.5;
scene.add(new THREE.HemisphereLight('#ffe2c4', '#9a7fb8', 1.55));
const sun = new THREE.DirectionalLight('#ffb46b', 2.4); sun.position.set(-4, 7, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); sun.shadow.bias = -.0005; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 48), new THREE.MeshLambertMaterial({ color: '#e6c9a8' })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// the lineup: kids in front (① left, ④ right), grown-ups behind
const front = ['hero', 'ngazwe', 'maythu', 'phoekyaw', 'chocho', 'thura', 'kid4'], back = ['sayagyi', 'utinmaung', 'mom1', 'mom4', 'mom0', 'bwabwa'];
const all = [];
const place = (ids, z) => ids.forEach((id, i) => { const c = makeCast(id, (t, o) => emit(t, o, c)); c.ch.root.position.set((i - (ids.length - 1) / 2) * .95, 0, z); scene.add(c.ch.root); c.tag = Object.assign(document.createElement('div'), { className: 'tag', textContent: c.def.name }); document.body.appendChild(c.tag); all.push(c); });
place(front, .9); place(back, -.7);

let sel = null, turn = false;
// thrown things: a water balloon flies out of the hand in an arc and bursts on the ground into a wet patch
const flying = [], W = new THREE.Vector3(), F = new THREE.Vector3();
function emit(type, obj, c) {
  if (type !== 'lob') return;
  obj.getWorldPosition(W); F.set(0, 0, 1).applyQuaternion(c.ch.root.quaternion);
  const m = new THREE.Mesh(new THREE.SphereGeometry(.07 * c.ch.scale, 12, 10), new THREE.MeshLambertMaterial({ color: '#4fb3d9' })); m.position.copy(W); m.castShadow = true; scene.add(m);
  flying.push({ m, v: F.clone().multiplyScalar(3.2).add(new THREE.Vector3(0, 2.6, 0)), life: 3 });
}
function burst(at) { const d = new THREE.Mesh(new THREE.CircleGeometry(.3, 20), new THREE.MeshBasicMaterial({ color: '#7fcbe8', transparent: true, opacity: .7, depthWrite: false })); d.rotation.x = -Math.PI / 2; d.position.set(at.x, .006, at.z); scene.add(d); flying.push({ m: d, splat: true, life: 2.5 }); }
const castBar = document.getElementById('cast');
const btn = (parent, label, on, cls = '') => { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = on; document.getElementById(parent).appendChild(b); return b; };
const castBtns = [btn('cast', 'အားလုံး', () => select(null))].concat(all.map(c => btn('cast', c.def.name, () => select(c), 's' + c.def.side)));
const LOOPS = [['idle', 'ရပ်'], ['walk', 'လမ်းလျှောက်'], ['run', 'ပြေး'], ['dance', 'ယိမ်းက'], ['sit', 'ထိုင်']], ONES = [['jump', 'ခုန်'], ['splash', 'ရေပက်'], ['wave', 'လက်ပြ'], ['kadaw', 'ကန်တော့'], ['shake', 'ခါ'], ['laugh', 'ရယ်']];
const targets = () => sel ? [sel] : all;
const loopBtns = LOOPS.map(([k, l]) => btn('loops', l, () => { targets().forEach(c => c.anim.setLoop(k)); loopBtns.forEach(b => b.classList.toggle('on', b.textContent === l)); }));
ONES.forEach(([k, l]) => btn('ones', l, () => targets().forEach(c => c.anim.play(k))));
btn('ones', 'ရေပက်ခံ', () => targets().forEach(c => { c.anim.soak(.8); c.anim.emote('drop'); }));
for (const [k, l] of [['note', '♪'], ['bang', '!'], ['heart', '❤']]) btn('ones', l, () => targets().forEach(c => c.anim.emote(k)));
btn('view', 'လှည့်ပြ', function () { turn = !turn; this.classList.toggle('on', turn); });
btn('view', 'ရှေ့ကြည့်', () => targets().forEach(c => c.ch.root.rotation.y = 0));
btn('view', 'ဘေးကြည့်', () => targets().forEach(c => c.ch.root.rotation.y = Math.PI / 2));
btn('view', 'နောက်ကြည့်', () => targets().forEach(c => c.ch.root.rotation.y = Math.PI));

function select(c) {
  sel = c; castBtns.forEach((b, i) => b.classList.toggle('on', i === (c ? all.indexOf(c) + 1 : 0)));
  const acts = document.getElementById('acts'); acts.innerHTML = '';
  document.getElementById('note').textContent = c ? c.def.name + ' — ' + c.def.note : 'အားလုံး — ① အပြာ · ④ အနီ · လူကြီး မီးခိုး။ နာမည် နှိပ်ရင် အနီးကပ်';
  if (c) c.def.acts.forEach(([k, l]) => btn('acts', l, () => c.act(k)));
  for (const o of all) o.ch.root.visible = !c || o === c; // a close-up shows that one alone (the front row hid the grown-ups)
  const narrow = innerWidth <= 700, p = c ? c.ch.root.position : new THREE.Vector3(narrow ? 0 : .7, 0, 0), h = c ? .62 * c.ch.scale : narrow ? -.5 : .7; // lineup sits left of the panel on wide screens, above it on phones
  const fit = Math.max(12.5, 3.9 / (Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * cam.aspect)); // far enough that the whole lineup fits across a phone held upright
  goal.target.set(p.x, h, p.z); goal.pos.set(p.x + (c ? 1.6 : 0), c ? h + .5 : fit * .4, p.z + (c ? 2.6 : fit));
}
const goal = { target: new THREE.Vector3(), pos: new THREE.Vector3() };
resize(); cam.position.set(0, 4.2, 10.5); ctl.target.set(0, .7, 0); select(null); cam.position.copy(goal.pos); ctl.target.copy(goal.target);
const qs = new URLSearchParams(location.search); if (qs.get('c')) select(all.find(c => c.def.id === qs.get('c')) || null); if (qs.get('a')) targets().forEach(c => c.anim.setLoop(qs.get('a')));
window.cast = { all, flying, get sel() { return sel; }, select: id => select(all.find(c => c.def.id === id) || null), act: k => sel?.act(k) };

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.fov = w <= 700 ? 44 : 28; cam.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); select(sel); }); resize();
const clock = new THREE.Clock(), V = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  for (const c of all) { c.anim.update(dt); if (turn && (!sel || sel === c)) c.ch.root.rotation.y += dt * .6; }
  for (let i = flying.length - 1; i >= 0; i--) { const f = flying[i]; f.life -= dt;
    if (f.splat) { f.m.material.opacity = .7 * Math.min(1, f.life / 1.2); f.m.scale.setScalar(1 + .2 * (2.5 - f.life)); }
    else { f.v.y -= 9 * dt; f.m.position.addScaledVector(f.v, dt); if (f.m.position.y < .04) { burst(f.m.position); f.life = 0; } }
    if (f.life <= 0) { scene.remove(f.m); flying.splice(i, 1); } }
  cam.position.lerp(goal.pos, 1 - Math.exp(-dt * 4)); ctl.target.lerp(goal.target, 1 - Math.exp(-dt * 4));
  ctl.update(); renderer.render(scene, cam);
  for (const c of all) { // name tags above the heads (hidden while one character is in close-up)
    V.set(c.ch.root.position.x, 1.2 * c.ch.scale + .15 + (c.ch.root.position.z < 0 && innerWidth <= 700 ? (all.indexOf(c) % 2) * .35 : 0), c.ch.root.position.z).project(cam); // phones: back-row tags alternate up and down so the names don't sit on each other
    const on = !sel && V.z < 1; c.tag.style.display = on ? '' : 'none';
    if (on) { c.tag.style.left = (V.x + 1) / 2 * innerWidth + 'px'; c.tag.style.top = (1 - V.y) / 2 * innerHeight + 'px'; }
  }
});
</script>
</body>
</html>
