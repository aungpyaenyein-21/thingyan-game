<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>သင်္ကြန်ပွဲ · Thingyan Pwe</title>
<style>
  :root{--gold:#e8c16a;--ink:#1c1426;--paper:#f6e8c8}
  html,body{margin:0;height:100%;background:#120c1c;color:var(--paper);
    font-family:Padauk,"Myanmar Sangam MN","Noto Sans Myanmar",sans-serif}
  #wrap{position:relative;width:800px;height:600px;margin:0 auto}
  canvas{display:block;image-rendering:pixelated}
  #hud{position:absolute;inset:0;pointer-events:none}
  .key{display:inline-block;min-width:22px;padding:2px 6px;border:2px solid var(--gold);
    border-bottom-width:4px;border-radius:4px;background:#2a1f3a;color:var(--gold);
    font:bold 13px monospace;text-align:center}
  #help{position:absolute;left:12px;bottom:10px;font-size:14px;line-height:1.9}
  #day{position:absolute;right:12px;top:10px;padding:4px 12px;border:2px solid var(--gold);
    border-radius:6px;background:rgba(28,20,38,.85);font-size:15px}
  #prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
    padding:6px 14px;border:2px solid var(--gold);border-radius:6px;background:rgba(28,20,38,.9);
    font-size:15px;display:none}
  #dlg{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:640px;
    padding:14px 18px;border:3px solid var(--gold);border-radius:8px;background:rgba(28,20,38,.95);
    font-size:17px;line-height:1.7;display:none;pointer-events:auto}
  #inv{position:absolute;right:12px;bottom:10px;display:flex;gap:6px}
  #inv img{width:40px;height:40px;image-rendering:pixelated;padding:4px;border:2px solid var(--gold);
    border-radius:6px;background:rgba(28,20,38,.85)}
  #dlg b{color:var(--gold);display:block;margin-bottom:4px}
  #dlg small{display:block;text-align:right;opacity:.7;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="day">အကြိုနေ့ · ၁/၅</div>
    <div id="help">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> လမ်းလျှောက်&nbsp;&nbsp;
      <span class="key">SHIFT</span> ပြေး&nbsp;&nbsp;
      <span class="key">E</span> လုပ်ဆောင်
    </div>
    <div id="inv"></div>
    <div id="prompt"><span class="key">E</span> <span id="ptext"></span></div>
    <div id="dlg"><b id="dname"></b><span id="dtext"></span><small>E ▸ ဆက်</small></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
